index:
  # Where the search index is stored. Empty = <FILESEARCH_HOME or ~/.filesearch>/index
  directory:
  commitEvery: 500

indexing:
  extensions:
    - txt
    - pdf
    - docx
    - doc
    - rtf
    - odt
    - html
    - htm
    - xml
    - md
    - json
    - csv
    - pptx
    - ppt
    - xlsx
    - xls
  maxFileSizeMb: 100
  # Supported forms: "**/<folder>/**" skips a folder anywhere, "**/<name>" skips a file name.
  # "*" works as a wildcard inside a name, e.g. "**/~$*" (Office lock files).
  excludePatterns:
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/target/**"
    - "**/build/**"
    - "**/.idea/**"
    - "**/.vscode/**"
    - "**/__pycache__/**"
    - "**/$RECYCLE.BIN/**"
    - "**/.DS_Store"
    - "**/Thumbs.db"
    - "**/desktop.ini"
    - "**/~$*"
  threads: 4

search:
  defaultSize: 10
  maxSize: 100
  highlight: true

watch:
  enabled: true
  debounceMs: 1000
  rescanIntervalMinutes: 60

logging:
  level: INFO
  file: logs/filesearch.log
