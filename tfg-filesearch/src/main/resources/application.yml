elasticsearch:
  host: localhost
  port: 9200
  scheme: http
  indexName: filesearch
  bulkSize: 100
  refreshInterval: 5s

indexing:
  extensions:
    - txt
    - pdf
    - docx
    - doc
    - html
    - xml
    - md
    - json
    - csv
  maxFileSizeMb: 100
  excludePatterns:
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/target/**"
    - "**/build/**"
    - "**/.idea/**"
    - "**/.vscode/**"
    - "**/__pycache__/**"
    - "**/.DS_Store"
  threads: 4

search:
  defaultSize: 10
  maxSize: 100
  highlight: true

watch:
  enabled: true
  debounceMs: 1000
  rescanIntervalMinutes: 60

logging:
  level: INFO
  file: logs/filesearch.log
